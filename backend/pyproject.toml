[project]
name = "opspilot"
version = "0.1.0"
description = "AI on-call assistant: retrieval over runbooks and code, plus an incident investigation agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery[redis]>=5.7.0",
    "python-multipart>=0.0.34",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "celery-types>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications,
# ASYNC: blocking calls inside async code, S: security checks
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works, and tests use fixed fake secrets
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
