# Scrapes Kuturl and the exporters for its Redis and Postgres, and evaluates the alert rules
# that turn trouble into OpsPilot incidents (through Alertmanager).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kuturl
    metrics_path: /metrics
    # Kuturl protects /metrics in production; this token is for the local demo only
    authorization:
      credentials: demo-metrics-token-0123456789
    static_configs:
      - targets: ["kuturl:3000"]
        labels:
          service: kuturl

  - job_name: kuturl-redis
    static_configs:
      - targets: ["kuturl-redis-exporter:9121"]
        labels:
          service: kuturl

  - job_name: kuturl-postgres
    static_configs:
      - targets: ["kuturl-postgres-exporter:9187"]
        labels:
          service: kuturl

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
