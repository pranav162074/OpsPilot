# Local infrastructure for development. The API itself runs on your machine (uv run ...),
# so code changes reload instantly without rebuilding images.
name: opspilot

services:
  postgres:
    # Postgres 17 with the pgvector extension preinstalled
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      # 5433 on your machine, so it never clashes with another Postgres you may have installed
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Append-only file, so queued jobs survive a container restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata: